- type: entity
  id: PartPlushie
  parent: [BaseItem, BasePart]
  name: "plushie body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic # Shitmed Change
  - type: BodyPart
  - type: Gibbable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 70
      behaviors:
      - !type:GibPartBehavior { }
  - type: StaticPrice
    price: 20

- type: entity
  id: TorsoPlushie
  name: "plushie torso"
  parent: [PartPlushie, BaseTorso]
  components:
  - type: Sprite
    sprite: Mobs/Species/Plushie/parts.rsi
    state: "torso_m"

