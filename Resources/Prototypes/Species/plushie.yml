- type: species
  id: Plushie
  name: species-name-human
  roundStart: true
  prototype: MobPlushie
  sprites: MobHumanSprites
  markingLimits: MobHumanMarkingLimits
  dollPrototype: MobPlushieDummy
  skinColoration: Hues
  customName: true
  minAge: 1
  maxAge: 100
  oldAge: 50
  youngAge: 50
  minHeight: 0.3
  defaultHeight: 0.5
  maxHeight: 1
  minWidth: 0.3
  defaultWidth: 0.5
  maxWidth: 1

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobHumanSprites
  sprites:
    Head: MobHumanHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    Chest: MobHumanTorso
    Underwear: MobHumanoidAnyMarking # Floof, add underwear
    Undershirt: MobHumanoidAnyMarking # Floof, add underwear
    Eyes: MobHumanoidEyes
    LArm: MobHumanLArm
    RArm: MobHumanRArm
    LHand: MobHumanLHand
    RHand: MobHumanRHand
    LLeg: MobHumanLLeg
    RLeg: MobHumanRLeg
    LFoot: MobHumanLFoot
    RFoot: MobHumanRFoot
    Tail: MobHumanoidAnyMarking
    Wings: MobHumanoidAnyMarking
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking

- type: markingPoints
  id: MobHumanMarkingLimits
  points:
    Underwear:
      points: 1
      required: false # Floof, add underwear
    Undershirt:
      points: 1
      required: false # Floof, add underwear
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
    Wings:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 4
      required: false
    Chest:
      points: 1
      required: false
    RightLeg:
      points: 2
      required: false
    RightFoot:
      points: 2
      required: false
    LeftLeg:
      points: 2
      required: false
    LeftFoot:
      points: 2
      required: false
    RightArm:
      points: 2
      required: false
    RightHand:
      points: 3
      required: false
    LeftArm:
      points: 2
      required: false
    LeftHand:
      points: 3
      required: false

