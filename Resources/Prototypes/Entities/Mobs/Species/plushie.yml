- type: entity
  parent:
  - MobFlammable
  - BaseMobSpecies
  id: BaseMobPlushie
  name: Urist McPlush
  description: A sapient plush toy.
  abstract: true
  components:
  - type: Body
    prototype: Plushie
    requiredLegs: 2
  - type: Icon # It will not have an icon in the adminspawn menu without this. Body parts seem fine for whatever reason.
    sprite: Mobs/Species/Plushie/parts.rsi
    state: full
  - type: Carriable # Carrying system from nyanotrasen.
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth
      amount: 5
  - type: HumanoidAppearance
    species: Plushie
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: MobThresholds
    thresholds:
      0: Alive
      119.999: Critical
      120: Dead
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - SolCommon
    understands:
    - TauCetiBasic
    - SolCommon
    naturalLanguage: TauCetiBasic # Floof: explicitly stated natural languages
  - type: FootPrints
  - type: ZombieImmune
  - type: Damageable
    damageContainer: Plushie
    damageModifierSet: Plushie
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 300
      behaviors:
      - !type:GibBehavior { }
  - type: PseudoItem
    storedOffset: 0,0
    shape:
    - 0, 0, 3, 3
  - type: Flammable
    fireStackIncreaseMultiplier: 2.00
  - type: Sprite
    scale: 0.6, 0.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.23
        density: 35
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.8
      90: 0.6
      120: 0.4
  - type: StepTriggerImmune
    whitelist:
      types:
      - Shard
  - type: PlayerToolModifier
    pryTimeMultiplier: 3
  - type: PlayerAccuracyModifier
    spreadMultiplier: 2.5
    maxSpreadAngle: 180
  - type: BonusMeleeDamage
    damageModifierSet:
      coefficients:
        Blunt: 0.2
        Slash: 0.8
        Piercing: 0.5
  - type: OfferItem
  - type: LayingDown
  - type: StandingState
  - type: Deathgasp
    prototype: DefaultDeathgasp
    needsCritical: false
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon
  - type: Flashable
  - type: Shoving
  - type: Fiber
    fiberMaterial: fibers-magic

- type: entity
  parent: BaseSpeciesDummy
  id: MobPlushieDummy
  categories: [ HideSpawnMenu ]
  description: A dummy plushie meant to be used in character setup.
  components:
  - type: HumanoidAppearance
    species: Plushie
